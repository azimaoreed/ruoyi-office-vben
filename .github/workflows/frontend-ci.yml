name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build workspace packages
        run: pnpm -r --filter "./packages/**" --filter "./internal/**" build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check:type

      - name: Build web-antd
        working-directory: apps/web-antd
        run: pnpm build

  ci-pass:
    name: Frontend CI Pass
    runs-on: ubuntu-latest
    needs:
      - frontend-check
    if: always()

    steps:
      - name: Check result
        run: |
          if [ "${{ needs.frontend-check.result }}" != "success" ]; then
            echo "Frontend CI failed"
            exit 1
          fi
          echo "Frontend CI passed"
