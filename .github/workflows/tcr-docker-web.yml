name: Build web image and deploy by Docker

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to target host after pushing image
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: tcr-docker-web-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: web-antd
  IMAGE_NAME: ruoyi-office-web
  CONTAINER_NAME: ruoyi-office-web
  DOCKER_NETWORK: ruoyi-office
  DOCKER_BUILDKIT: '1'

jobs:
  build-push:
    name: Build and push web image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TCR inputs
        run: |
          set -euo pipefail
          test -n "${{ secrets.TCR_REGISTRY }}"
          test -n "${{ secrets.TCR_NAMESPACE }}"
          test -n "${{ secrets.TCR_USERNAME }}"
          test -n "${{ secrets.TCR_PASSWORD }}"

      - name: Login to TCR
        run: |
          docker logout "${{ secrets.TCR_REGISTRY }}" >/dev/null 2>&1 || true
          echo "${{ secrets.TCR_PASSWORD }}" \
            | docker login "${{ secrets.TCR_REGISTRY }}" \
              --username "${{ secrets.TCR_USERNAME }}" \
              --password-stdin

      - name: Build and push Docker image
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          IMAGE="${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${IMAGE_NAME}"
          echo "Pushing web image to ${IMAGE}:${TAG} and ${IMAGE}:latest"
          docker build \
            --target production \
            --build-arg APP_NAME="${APP_NAME}" \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            -f scripts/deploy/Dockerfile .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy web container
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' || github.event.inputs.deploy == 'true'

    steps:
      - name: Validate deploy inputs
        run: |
          set -euo pipefail
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          test -n "${{ secrets.TCR_REGISTRY }}"
          test -n "${{ secrets.TCR_USERNAME }}"
          test -n "${{ secrets.TCR_PASSWORD }}"

      - name: Deploy via Docker on target host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            TAG="${{ needs.build-push.outputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "ERROR: image tag output is empty"
              exit 1
            fi
            IMAGE="${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${TAG}"

            CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
            DOCKER_NETWORK="${{ env.DOCKER_NETWORK }}"
            HOST_PORT="${{ secrets.WEB_HOST_PORT || '8080' }}"
            BACKEND_HOST="${{ secrets.BACKEND_CONTAINER_HOST || 'yudao-server' }}"
            BACKEND_PORT="${{ secrets.BACKEND_CONTAINER_PORT || '48080' }}"

            docker logout "${{ secrets.TCR_REGISTRY }}" >/dev/null 2>&1 || true
            echo "${{ secrets.TCR_PASSWORD }}" \
              | docker login "${{ secrets.TCR_REGISTRY }}" \
                --username "${{ secrets.TCR_USERNAME }}" \
                --password-stdin

            docker network inspect "${DOCKER_NETWORK}" >/dev/null 2>&1 \
              || docker network create "${DOCKER_NETWORK}"

            docker pull "${IMAGE}"
            docker rm -f "${CONTAINER_NAME}" >/dev/null 2>&1 || true
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart always \
              --network "${DOCKER_NETWORK}" \
              -p "${HOST_PORT}:8080" \
              -e NGINX_PORT=8080 \
              -e BACKEND_SCHEMA=http \
              -e BACKEND_HOST="${BACKEND_HOST}" \
              -e BACKEND_PORT="${BACKEND_PORT}" \
              "${IMAGE}"

            docker ps --filter "name=${CONTAINER_NAME}"
