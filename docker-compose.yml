services:
  ruoyi-office-web:
    build:
      context: .
      dockerfile: scripts/deploy/Dockerfile
      args:
        APP_NAME: ${APP_NAME:-web-antd}
    container_name: ruoyi-office-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-host.docker.internal}
      BACKEND_PORT: ${BACKEND_PORT:-48080}
      BACKEND_SCHEMA: ${BACKEND_SCHEMA:-http}
      NGINX_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
