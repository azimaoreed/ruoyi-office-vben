# 详见: README.md 和 配置对比.md
#
# Vben Admin 前端应用 Nginx 配置
# 访问路径: http://182.92.106.252/web
# 
# 重要说明：
# 方式1（推荐）：将下面的 location /web 块添加到现有的 server 块中
# 方式2：使用完整的 server 配置（如果需要独立配置）

# ===== 方式1：仅 location 块（需要添加到现有 server 中）=====
# 复制以下内容到 /data/nginx/conf/conf.d/default.conf 的 server 块内

location /web {
    # 去掉 /web 前缀，指向实际文件路径
    alias /usr/share/nginx/html/web;
    index index.html;

    # SPA 路由支持：所有请求都返回 index.html
    try_files $uri $uri/ /web/index.html;

    # 字符集
    charset utf-8;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # 静态资源缓存（JS、CSS、图片等）
    location ~* ^/web/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
        alias /usr/share/nginx/html/web;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /web/\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

