# ⚠️ 此配置文件已被弃用
# 请使用统一配置文件: ruoyi-office.conf
# 详见: README.md

server {
    listen 80 default_server;
    server_name _;  # 替换为你的域名，如: doc.example.com
    
    root /usr/share/nginx/html/ruoyi-office-doc;
    index index.html;

    access_log /var/log/nginx/ruoyi-office-doc-access.log;
    error_log /var/log/nginx/ruoyi-office-doc-error.log;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
