# ========================================
# 芋道办公平台 Nginx 统一配置
# ========================================
# 
# 部署项目：
#   1. VitePress文档站点    - 根路径: http://182.92.106.252/
#   2. Vben Admin管理后台   - 子路径: http://182.92.106.252/web
#
# 部署路径映射：
#   / -> /usr/share/nginx/html/ruoyi-office-doc
#   /web -> /usr/share/nginx/html/web
# ========================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name 182.92.106.252 _;  # 可替换为你的域名
    
    # ========================================
    # 全局配置
    # ========================================
    
    charset utf-8;
    
    # 访问日志
    access_log /var/log/nginx/ruoyi-office-access.log;
    error_log /var/log/nginx/ruoyi-office-error.log;
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/x-javascript image/svg+xml;
    
    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========================================
    # 1. VitePress 文档站点（根路径）
    # ========================================
    # 访问地址: http://182.92.106.252/
    
    location / {
        root /usr/share/nginx/html/ruoyi-office-doc;
        index index.html;
        
        # SPA 路由支持
        try_files $uri $uri/ $uri.html /index.html;
        
        # 静态资源缓存
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
            root /usr/share/nginx/html/ruoyi-office-doc;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
    
    # ========================================
    # 2. Vben Admin 管理后台（/web 子路径）
    # ========================================
    # 访问地址: http://182.92.106.252/web
    
    location /web {
        # 使用 alias 去掉 /web 前缀
        alias /usr/share/nginx/html/web;
        index index.html;
        
        # SPA 路由支持：所有请求都返回 index.html
        try_files $uri $uri/ /web/index.html;
        
        # 静态资源缓存
        location ~* ^/web/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
            alias /usr/share/nginx/html/web;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # 禁止访问隐藏文件
        location ~ ^/web/\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
    
    # ========================================
    # 3. 后端API代理配置（可选）
    # ========================================
    # 如果后端服务部署在同一服务器或内网可访问，取消注释以下配置
    # 推荐使用此方案，避免跨域问题
    
    location /admin-api {
        # 代理到后端服务
        # 如果后端在同一服务器，使用 localhost
        proxy_pass http://182.92.106.252:48080;
        
        # 如果后端在其他服务器，使用实际IP（例如：192.168.30.130）
        # proxy_pass http://192.168.30.130:48080;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲区设置
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 128k;
    }
    
    # ========================================
    # 4. 健康检查接口
    # ========================================
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # ========================================
    # 5. 错误页面
    # ========================================
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
